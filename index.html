<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایت امیرحسین</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #050816, #171044, #061a35);
    }
    .card {
      width: 90%;
      max-width: 450px;
      padding: 35px 20px;
      border: 1px solid #8b5cf6;
      border-radius: 24px;
      background: rgba(10, 15, 40, 0.85);
      box-shadow: 0 0 25px #5135c9;
    }
    h1 {
      color: #55e7ff;
      text-shadow: 0 0 15px #00bfff;
    }
    p { line-height: 2; }
    .tag {
      display: inline-block;
      margin: 5px;
      padding: 8px 13px;
      border: 1px solid #a78bfa;
      border-radius: 20px;
      color: #d8b4fe;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>امیرحسین سجادیان</h1>
    <p>به اولین سایت من خوش اومدی! 🚀</p>
    <p>من در حال یادگیری طراحی سایت با گوشی و برنامه Acode هستم.</p>
    <span class="tag">HTML</span>
    <span class="tag">CSS</span>
    <span class="tag">طراحی سایت</span>
    <a href="https://github.com/">ورود به GitHub</a>
  </main>
</body>
</html>
